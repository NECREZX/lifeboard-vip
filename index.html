<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Lifeboard - All-in-One Life Dashboard</title>
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="color-scheme" id="meta-color-scheme" content="light dark" />
    <meta name="theme-color" id="meta-theme-color" content="#FF7777" />
    <meta name="msapplication-navbutton-color" content="#FF7777" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      (function() {
        try {
          var s = localStorage.getItem('fin_settings');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = systemDark;
          var themeColor = '#FF7777';
          if (s) {
            var p = JSON.parse(s);
            if (typeof p.isDarkMode === 'boolean') {
              isDark = p.isDarkMode;
            }
            if (p.themeColor === 'custom' && p.customAccentColor) {
              themeColor = p.customAccentColor;
            } else if (p.customAccentColor) {
              themeColor = p.customAccentColor;
            } else {
              var presets = {
                coral: '#FF7777',
                sakura: '#EC4899',
                emerald: '#10B981',
                blue: '#3B82F6',
                indigo: '#6366F1',
                amber: '#F59E0B',
                violet: '#8B5CF6',
                rose: '#F43F5E',
                classic: '#0F172A'
              };
              if (p.themeColor && presets[p.themeColor]) {
                themeColor = presets[p.themeColor];
              }
            }
          }
          var sysColor = isDark ? '#121212' : '#ffffff';
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
          var colorSchemeMeta = document.getElementById('meta-color-scheme');
          if (colorSchemeMeta) colorSchemeMeta.setAttribute('content', isDark ? 'dark' : 'light');

          // Status bar bawaan HP (bagian atas) WAJIB mengikuti kustomisasi tema banner
          var meta = document.getElementById('meta-theme-color');
          if (meta) meta.setAttribute('content', themeColor);
          var ms = document.querySelector('meta[name=msapplication-navbutton-color]');
          if (ms) ms.setAttribute('content', themeColor);

          // Navigasi sistem bawaan HP (bagian bawah) menyatu dengan background
          document.documentElement.style.backgroundColor = sysColor;

          if (window.matchMedia) {
            var mq = window.matchMedia('(prefers-color-scheme: dark)');
            var applyMode = function(e) {
              var dark = e.matches;
              var curSaved = localStorage.getItem('fin_settings');
              if (curSaved) {
                try {
                  var cp = JSON.parse(curSaved);
                  cp.isDarkMode = dark;
                  localStorage.setItem('fin_settings', JSON.stringify(cp));
                } catch(err) {}
              }
              var c = dark ? '#121212' : '#ffffff';
              if (dark) {
                document.documentElement.classList.add('dark');
                document.documentElement.style.colorScheme = 'dark';
              } else {
                document.documentElement.classList.remove('dark');
                document.documentElement.style.colorScheme = 'light';
              }
              document.documentElement.style.backgroundColor = c;
              if (document.body) document.body.style.backgroundColor = c;
              if (colorSchemeMeta) colorSchemeMeta.setAttribute('content', dark ? 'dark' : 'light');
            };
            if (mq.addEventListener) {
              mq.addEventListener('change', applyMode);
            } else if (mq.addListener) {
              mq.addListener(applyMode);
            }
          }
        } catch(e) {}
      })();
    </script>
    
    <!-- Instagram Sans Fonts (Official App Typography) -->
    <link rel="preload" href="/fonts/InstagramSans-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/InstagramSans-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/InstagramSans-Bold.woff2" as="font" type="font/woff2" crossorigin />
    
    <!-- Google Fonts for rich typography & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&family=Petit+Formal+Script&family=Playwrite+DE+Grund:wght@100..400&family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Figtree:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Parkinsans:wght@300..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
        font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
      }
    </style>
  </head>
  <body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Register Service Worker for PWA installation -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((reg) => {
              // Cek pembaruan berkala secara aman tanpa memicu unhandled rejection
              if (reg && typeof reg.update === 'function') {
                reg.update().catch(() => {
                  // Mengabaikan error sementara saat reload jaringan dev
                });
              }
            })
            .catch((err) => {
              console.warn('PWA Service Worker tidak dapat didaftarkan:', err);
            });

          // Otomatis refresh jika ada service worker controller baru yang aktif
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
</html>
