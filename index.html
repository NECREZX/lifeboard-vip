<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Lifeboard - All-in-One Life Dashboard</title>
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="color-scheme" id="meta-color-scheme" content="light" />
    <meta name="theme-color" id="meta-theme-color" content="#FF7777" />
    <meta name="msapplication-navbutton-color" content="#FF7777" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      (function() {
        try {
          var s = localStorage.getItem('fin_settings');
          if (s) {
            var p = JSON.parse(s);
            var map = {
              rose: '#f43f5e',
              pink: '#ec4899',
              emerald: '#10b981',
              amber: '#f59e0b',
              sky: '#0ea5e9',
              purple: '#8b5cf6',
              orange: '#f97316',
              teal: '#14b8a6',
              indigo: '#6366f1'
            };
            var isDark = p.isDarkMode;
            var color = isDark ? '#000000' : ((p.themeColor === 'custom' && p.customAccentColor) 
              ? p.customAccentColor 
              : (map[p.themeColor] || '#FF7777'));
            if (color) {
              var meta = document.getElementById('meta-theme-color');
              if (meta) meta.setAttribute('content', color);
              var ms = document.querySelector('meta[name=msapplication-navbutton-color]');
              if (ms) ms.setAttribute('content', color);
              document.documentElement.style.backgroundColor = color;
            }
          }
        } catch(e) {}
      })();
    </script>
    
    <!-- Instagram Sans Fonts (Official App Typography) -->
    <link rel="preload" href="/fonts/InstagramSans-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/InstagramSans-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/InstagramSans-Bold.woff2" as="font" type="font/woff2" crossorigin />
    
    <!-- Google Fonts for rich typography & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&family=Petit+Formal+Script&family=Playwrite+DE+Grund:wght@100..400&family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Figtree:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Parkinsans:wght@300..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
        font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
      }
    </style>
  </head>
  <body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Register Service Worker for PWA installation -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((reg) => {
              // Cek pembaruan berkala secara aman tanpa memicu unhandled rejection
              if (reg && typeof reg.update === 'function') {
                reg.update().catch(() => {
                  // Mengabaikan error sementara saat reload jaringan dev
                });
              }
            })
            .catch((err) => {
              console.warn('PWA Service Worker tidak dapat didaftarkan:', err);
            });

          // Otomatis refresh jika ada service worker controller baru yang aktif
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
</html>
